 panel.material.map=cv([[d[1],40,'#ffffff'],[d[5],30,'#cfd6e4']],640,300,'rgba(15,17,24,.92)');panel.material.needsUpdate=true;panel.position.set(P[i].x*.6,2.9,P[i].z);panel.visible=true}

cvs.addEventListener('pointerdown',e=>dn={x:e.clientX,y:e.clientY,m:0});

addEventListener('keydown',e=>keys[e.key.toLowerCase()]=1);addEventListener('keyup',e=>delete keys[e.key.toLowerCase()]);

 c.addEventListener('selectstart',()=>{tm.identity().extractRotation(c.matrixWorld);rc.ray.origin.setFromMatrixPosition(c.matrixWorld);rc.ray.direction.set(0,0,-1).applyMatrix4(tm);
  if(!pick()){const f=rc.intersectObjects(floors)[0];if(f){rig.position.set(f.point.x,0,f.point.z);clampRig()}}});rig.add(c)}

ren.setAnimationLoop(t=>{const dt=Math.min((t-t0)/1000,.1);t0=t;mods.forEach(m=>m.rotation.y+=dt*.5);
 cam.getWorldPosition(v);if(panel.visible)panel.lookAt(v.x,panel.position.y,v.z);
 if(!ren.xr.isPresenting){const f=(keys.w||keys.arrowup?1:0)-(keys.s||keys.arrowdown?1:0),s=(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0);
  rig.position.x+=(-Math.sin(yaw)*f+Math.cos(yaw)*s)*dt*4;rig.position.z+=(-Math.cos(yaw)*f-Math.sin(yaw)*s)*dt*4;clampRig()}
 else{const ss=ren.xr.getSession();if(ss)ss.inputSources.forEach(s=>{const g=s.gamepad;if(!g)return;const a=g.axes,h=s.handedness;
  if(a.length>3){if(h=='left'){cam.getWorldDirection(v);v.y=0;v.normalize();const f=-a[3],r=a[2];if(Math.abs(f)>.15||Math.abs(r)>.15){rig.position.x+=(v.x*f-v.z*r)*dt*2.5;rig.position.z+=(v.z*f+v.x*r)*dt*2.5;clampRig()}}else if(Math.abs(a[2])>.7){if(!tn){tn=1;yaw+=a[2]>0?-.5236:.5236;rig.rotation.y=yaw}}else tn=0}
  [4,5].forEach(b=>{const k=h+b,p=!!(g.buttons[b]&&g.buttons[b].pressed);if(p&&!pr[k])stand(cur+(b==4?1:-1));pr[k]=p})})}
 ren.render(scene,cam)});
